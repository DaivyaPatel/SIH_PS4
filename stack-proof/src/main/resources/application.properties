spring.application.name=workflow-stack-proof
spring.main.web-application-type=none
spring.datasource.url=${PROOF_DATABASE_URL}
spring.datasource.username=${PROOF_DATABASE_USER}
spring.datasource.password=${PROOF_DATABASE_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:proof-schema.sql
spring.datasource.hikari.maximum-pool-size=4
